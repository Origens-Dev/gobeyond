name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests, vet, and race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          check-latest: true
      - run: go run ./cmd/gobeyond generate --go-only
      - run: ./scripts/verify-public-boundaries.sh
      - run: go vet ./...
      - run: go test -race ./...

  javascript:
    name: JavaScript workspace and generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --recursive typecheck
      - run: pnpm --recursive test
      - run: pnpm generate:check

  production-artifact:
    name: Node-free production artifact audit
    runs-on: ubuntu-latest
    needs: [go, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          check-latest: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @go-beyond/compiler build
      - run: pnpm build
      - run: ./scripts/verify-node-free-server.sh dist/server

  opentofu:
    name: OpenTofu formatting and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"
      - run: ./scripts/verify-opentofu.sh infra/opentofu
