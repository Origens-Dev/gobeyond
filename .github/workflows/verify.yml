name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests, vet, and race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          check-latest: true
      - uses: pnpm/action-setup@v4
      - run: go run ./cmd/gobeyond generate --go-only
      - run: ./scripts/verify-public-boundaries.sh
      - run: go vet ./...
      - run: go test -race ./...
      # imageopt/s3 is a nested module so the AWS SDK stays out of the root
      # module graph; ./... above does not reach it.
      - run: go vet ./...
        working-directory: imageopt/s3
      - run: go test -race ./...
        working-directory: imageopt/s3

  javascript:
    name: JavaScript workspace and generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @go-beyond/vite and examples/seo-site type-check against the emitted
      # declarations of the workspace packages, so build those first.
      - run: pnpm --filter @go-beyond/schema --filter @go-beyond/compiler --filter @go-beyond/react --filter @go-beyond/vite build
      - run: pnpm --recursive typecheck
      - run: pnpm --recursive test
      - run: pnpm generate:check

  production-artifact:
    name: Node-free production artifact audit
    runs-on: ubuntu-latest
    needs: [go, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          check-latest: true
      - run: pnpm install --frozen-lockfile
      # The seo-site build type-checks against the workspace packages'
      # emitted declarations, so build those first.
      - run: pnpm --filter @go-beyond/schema --filter @go-beyond/compiler --filter @go-beyond/react --filter @go-beyond/vite build
      - run: pnpm build
      - run: ./scripts/verify-node-free-server.sh dist/server

  opentofu:
    name: OpenTofu formatting and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"
      - run: ./scripts/verify-opentofu.sh infra/opentofu
